[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cos1"
version = "0.2.0"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "pandas==2.2.3", "matplotlib==3.10.8"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "jupyterlab>=4,<5"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
exclude = ["legacy", "notebooks"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
